# Rendered by init-project.mjs. {{USER_DOCS_DIR}} and {{SCREENSHOTS_DIR}} are
# replaced with the project's configured paths.
name: Documentation Sync

on:
  workflow_dispatch:
  schedule:
    # GitHub schedules use UTC. Adjust to the project's maintenance window.
    - cron: "0 8 * * *"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: docs-sync
  cancel-in-progress: false

jobs:
  openwiki:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: true
          # Full history so OpenWiki can diff HEAD against the last documented
          # commit. A shallow clone hides that commit.
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - name: Install OpenWiki
        # mermaid + jsdom add high-fidelity Mermaid validation. Remove if the
        # wiki has no diagrams or to reduce install time.
        run: npm install --global openwiki@0.9.0 mermaid@11.16.0 jsdom@29.1.1

      - name: Update OpenWiki
        id: openwiki
        continue-on-error: true
        run: openwiki code --update --print
        env:
          # Anonymous reliability telemetry. Set to "1" to opt out.
          OPENWIKI_TELEMETRY_DISABLED: "1"
          # Provider credentials are separate from interactive agent sessions.
          # Configure the repository secret before enabling this workflow.
          OPENWIKI_PROVIDER: ${{ vars.OPENWIKI_PROVIDER || 'openrouter' }}
          OPENWIKI_MODEL_ID: ${{ vars.OPENWIKI_MODEL_ID || 'z-ai/glm-5.2' }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          # Optional tracing; remove if unused.
          LANGSMITH_API_KEY: ${{ secrets.LANGSMITH_API_KEY }}
          LANGCHAIN_PROJECT: openwiki
          LANGCHAIN_TRACING_V2: ${{ secrets.LANGSMITH_API_KEY && 'true' || 'false' }}

      - name: Remove transient run state
        if: ${{ !cancelled() }}
        run: rm -f -- openwiki/.run.json

      - name: Validate documentation structure
        if: ${{ !cancelled() }}
        run: |
          if [ -f .documentation/toolkit/validate-config.mjs ]; then
            node .documentation/toolkit/validate-config.mjs --root .
          fi
          if [ -f .documentation/toolkit/audit-project.mjs ]; then
            node .documentation/toolkit/audit-project.mjs --root . --json > .documentation/audit/ci.json || true
          fi

      - name: Create documentation pull request
        id: create-pr
        if: ${{ !cancelled() }}
        uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676 # v7
        with:
          # Documentation-only paths. Never add application source here.
          add-paths: |
            openwiki
            {{USER_DOCS_DIR}}
            {{SCREENSHOTS_DIR}}
            .documentation/audit
            AGENTS.md
          branch: docs/automated-update
          delete-branch: true
          commit-message: "docs: update documentation"
          title: "docs: update documentation"
          body: |
            Automated documentation update.

            OpenWiki result: `${{ steps.openwiki.outcome }}`

            This pull request is documentation-only. It is never auto-merged.
            Review the diff and run the documentation audit before merging.

      - name: Annotate pull request
        if: ${{ !cancelled() && steps.create-pr.outputs.pull-request-url != '' }}
        run: echo "::notice title=Documentation update::${{ steps.create-pr.outputs.pull-request-url }}"

      - name: Propagate OpenWiki failure
        if: ${{ steps.openwiki.outcome == 'failure' }}
        run: exit 1
